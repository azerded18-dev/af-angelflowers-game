<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сад AF AngelFlowers — Мини-игра</title>
    <style>
        :root {
            --primary-color: #5c2c16;
            --accent-color: #8b4513;
            --bg-color: #fdfbf7;
            --card-bg: #fffef9;
            --text-color: #333;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
        }
        .stats-panel {
            display: flex;
            justify-content: space-around;
            background: #f4ebd9;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
        }
        .garden-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .plot {
            background: #e8dcc4;
            border: 2px dashed var(--accent-color);
            border-radius: 8px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }
        .plot:hover {
            background: #dfcfb2;
        }
        .plot img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-bottom: 3px;
        }
        .plot-text {
            font-size: 10px;
            color: var(--primary-color);
            font-weight: bold;
        }
        .progress-container {
            width: 80%;
            background: #ddd;
            border-radius: 4px;
            height: 6px;
            margin-top: 4px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background: #4caf50;
            width: 0%;
            transition: width 0.3s;
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            font-family: 'Georgia', serif;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .btn:hover {
            background: var(--accent-color);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .inventory {
            background: #faf6ed;
            border: 1px solid #dcd1be;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .inventory h3 {
            font-size: 13px;
            margin: 0 0 8px 0;
            color: var(--primary-color);
            text-align: center;
        }
        .collected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-height: 70px;
            overflow-y: auto;
        }
        .badge {
            background: #e4d5bc;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            border: 2px solid var(--primary-color);
        }
        .promo-code {
            background: #f4ebd9;
            padding: 8px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #d32f2f;
            margin: 10px 0;
            border: 1px dashed var(--accent-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AF AngelFlowers</h1>
    <div class="subtitle">Вырасти свой сад в Тамбове и получи приз!</div>

    <div class="stats-panel">
        <div>Вода: <span id="waterCount">5</span> 💧</div>
        <div>Собрано: <span id="collectedCount">0</span>/10 🌱</div>
    </div>

    <div class="garden-grid" id="gardenGrid">
        <!-- Грядки генерируются JS -->
    </div>

    <button class="btn" id="waterAllBtn" onclick="waterAll()">Полить все грядки 🚿</button>
    <button class="btn" onclick="openPromoModal()">🎁 Получить приз / Промокод</button>
</div>

<!-- Модальное окно приза -->
<div class="modal" id="promoModal">
    <div class="modal-content">
        <h3 style="color: var(--primary-color); margin-top:0;">Награда садовника</h3>
        <p id="modalText">Соберите 10 одинаковых растений, чтобы получить бесплатный черенок к заказу!</p>
        <div class="promo-code" id="promoCodeContainer" style="display:none;">AF-GIFT-2026</div>
        <button class="btn" onclick="closePromoModal()">Закрыть</button>
    </div>
</div>

<script>
    // Инициализация игры
    const plotsCount = 6;
    let water = 5;
    let plots = Array(plotsCount).fill(null).map(() => ({ state: 'empty', progress: 0, timer: null }));
    let collectedItems = JSON.parse(localStorage.getItem('af_collected')) || [];

    const varieties = [
        "Astra Purple", "3D Pink", "Double Yellow", "Double White", 
        "3D Yellow '18", "Flowerpower 3D Violet Ice", "Octicade Yellow", "FlowerPower Pink Sun"
    ];

    function saveGame() {
        localStorage.setItem('af_collected', JSON.stringify(collectedItems));
    }

    function renderGarden() {
        const grid = document.getElementById('gardenGrid');
        grid.innerHTML = '';

        plots.forEach((plot, index) => {
            const div = document.createElement('div');
            div.className = 'plot';
            
            if (plot.state === 'empty') {
                div.innerHTML = `<span style="font-size:20px;">🌱</span><span class="plot-text">Посадить</span>`;
                div.onclick = () => plantSeed(index);
            } else if (plot.state === 'growing') {
                div.innerHTML = `
                    <span style="font-size:20px;">🌿</span>
                    <span class="plot-text">Растет...</span>
                    <div class="progress-container" style="display:block;">
                        <div class="progress-bar" style="width: ${plot.progress}%"></div>
                    </div>
                `;
                div.onclick = () => waterPlant(index);
            } else if (plot.state === 'ready') {
                div.innerHTML = `<span style="font-size:24px;">🌸</span><span class="plot-text" style="color:#2e7d32;">Готово! (Собрать)</span>`;
                div.onclick = () => harvestPlant(index);
            }

            grid.appendChild(div);
        });

        document.getElementById('waterCount').innerText = water;
        document.getElementById('collectedCount').innerText = collectedItems.length;
    }

    function plantSeed(index) {
        if (plots[index].state === 'empty') {
            const randomVariety = varieties[Math.floor(Math.random() * varieties.length)];
            plots[index].state = 'growing';
            plots[index].progress = 0;
            plots[index].variety = randomVariety;
            renderGarden();
        }
    }

    function waterPlant(index) {
        if (plots[index].state === 'growing') {
            if (water > 0) {
                water--;
                plots[index].progress += 34;
                if (plots[index].progress >= 100) {
                    plots[index].progress = 100;
                    plots[index].state = 'ready';
                }
                renderGarden();
            } else {
                alert('Не хватает воды! Вода восстанавливается со временем или за активность в группе ВК.');
            }
        }
    }

    function waterAll() {
        let wateredAny = false;
        plots.forEach((plot, index) => {
            if (plot.state === 'growing' && water > 0) {
                water--;
                plot.progress += 34;
                if (plot.progress >= 100) {
                    plot.progress = 100;
                    plot.state = 'ready';
                }
                wateredAny = true;
            }
        });
        if (wateredAny || water === 0) {
            renderGarden();
        } else {
            alert('Нет растений для полива или закончилась вода!');
        }
    }

    function harvestPlant(index) {
        if (plots[index].state === 'ready') {
            collectedItems.push(plots[index].variety);
            saveGame();
            plots[index] = { state: 'empty', progress: 0 };
            renderGarden();
            
            // Восстановление воды за сбор
            water += 2;
            renderGarden();
        }
    }

    function openPromoModal() {
        const modal = document.getElementById('promoModal');
        const modalText = document.getElementById('modalText');
        const promoContainer = document.getElementById('promoCodeContainer');

        if (collectedItems.length >= 10) {
            modalText.innerText = "Поздравляем! Вы собрали коллекцию из 10 растений и получаете право на бесплатный черенок к заказу!";
            promoContainer.style.display = 'block';
        } else {
            modalText.innerText = `У вас собрано ${collectedItems.length}/10 растений. Продолжайте выращивать цветы на грядках, чтобы разблокировать бесплатный черенок!`;
            promoContainer.style.display = 'none';
        }
        modal.style.display = 'flex';
    }

    function closePromoModal() {
        document.getElementById('promoModal').style.display = 'none';
    }

    // Автовосстановление воды каждые 30 секунд
    setInterval(() => {
        if (water < 10) {
            water++;
            renderGarden();
        }
    }, 30000);

    renderGarden();
</script>

</body>
</html>
